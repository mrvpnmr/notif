<!DOCTYPE html>
<html dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📢 نوتیفیکیشن‌های مدیریت</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Tahoma', 'Vazir', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        
        .header {
            background: white;
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            margin-bottom: 30px;
        }
        
        .header h1 {
            color: #2d3748;
            font-size: 2em;
            margin-bottom: 10px;
        }
        
        .header .subtitle {
            color: #718096;
            font-size: 1em;
        }
        
        .status-badge {
            display: inline-block;
            background: #48bb78;
            color: white;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 0.9em;
            margin-top: 15px;
        }
        
        .status-badge .count {
            background: white;
            color: #48bb78;
            padding: 0 8px;
            border-radius: 50%;
            font-weight: bold;
            margin-right: 5px;
        }
        
        .notifications-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .notification {
            background: white;
            border-radius: 15px;
            padding: 20px 25px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            border-right: 5px solid #667eea;
            animation: slideIn 0.5s ease;
            transition: all 0.3s;
        }
        
        .notification:hover {
            transform: translateX(-5px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.2);
        }
        
        .notification.new {
            border-right-color: #f5576c;
            background: #fff5f5;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .notification .sender {
            font-weight: bold;
            color: #4a5568;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }
        
        .notification .sender .badge {
            background: #48bb78;
            color: white;
            padding: 2px 12px;
            border-radius: 12px;
            font-size: 0.8em;
        }
        
        .notification .sender .time {
            color: #a0aec0;
            font-size: 0.9em;
            font-weight: normal;
            margin-right: auto;
        }
        
        .notification .message {
            font-size: 1.1em;
            color: #2d3748;
            padding: 15px;
            background: #f7fafc;
            border-radius: 10px;
            line-height: 1.8;
            margin: 10px 0;
        }
        
        .notification .message .label {
            color: #718096;
            font-size: 0.9em;
            display: block;
            margin-bottom: 5px;
        }
        
        .empty-state {
            background: white;
            border-radius: 20px;
            padding: 60px 20px;
            text-align: center;
            color: #718096;
        }
        
        .empty-state .icon {
            font-size: 4em;
            margin-bottom: 20px;
        }
        
        .empty-state h3 {
            color: #2d3748;
            margin-bottom: 10px;
        }
        
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #2d3748;
            color: white;
            padding: 15px 30px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            animation: slideUp 0.5s ease;
            z-index: 1000;
            display: none;
            font-size: 1.1em;
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }
        
        .footer {
            text-align: center;
            color: rgba(255,255,255,0.7);
            margin-top: 30px;
            font-size: 0.9em;
        }
        
        .footer a {
            color: white;
            text-decoration: none;
        }
        
        .refresh-btn {
            background: rgba(255,255,255,0.2);
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9em;
            margin-top: 15px;
            transition: all 0.3s;
        }
        
        .refresh-btn:hover {
            background: rgba(255,255,255,0.3);
        }
        
        @media (max-width: 600px) {
            .header h1 {
                font-size: 1.5em;
            }
            
            .notification {
                padding: 15px;
            }
            
            .notification .message {
                font-size: 1em;
                padding: 10px;
            }
            
            .toast {
                width: 90%;
                font-size: 1em;
                padding: 12px 20px;
                bottom: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>📢 نوتیفیکیشن‌های مدیریت</h1>
            <p class="subtitle">پیام‌های ارسالی از طریق ربات تلگرام</p>
            
            <div class="status-badge" id="statusBadge">
                🟢 متصل
                <span class="count" id="notifCount">0</span>
            </div>
            
            <button class="refresh-btn" onclick="loadNotifications()">
                🔄 بروزرسانی
            </button>
        </div>
        
        <!-- لیست نوتیفیکیشن‌ها -->
        <div class="notifications-container" id="notificationsContainer">
            <!-- توسط JavaScript پر می‌شود -->
        </div>
        
        <div class="footer">
            <p>🔔 دریافت خودکار نوتیفیکیشن‌ها | 
            <a href="#" onclick="loadNotifications(); return false;">بروزرسانی دستی</a></p>
        </div>
    </div>
    
    <!-- Toast برای نوتیفیکیشن جدید -->
    <div class="toast" id="toast">
        🔔 پیام جدید از مدیریت
    </div>
    
    <script>
        let lastId = 0;
        let isFirstLoad = true;
        
        // بارگذاری نوتیفیکیشن‌ها
        async function loadNotifications() {
            try {
                const response = await fetch('/api/notifications/all');
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                const notifications = await response.json();
                
                if (notifications && notifications.length > 0) {
                    lastId = notifications[0].id;
                    document.getElementById('notifCount').textContent = notifications.length;
                }
                
                renderNotifications(notifications || []);
                
                // بروزرسانی وضعیت
                document.getElementById('statusBadge').innerHTML = 
                    `🟢 متصل <span class="count">${notifications ? notifications.length : 0}</span>`;
                
            } catch (error) {
                console.error('Error loading notifications:', error);
                document.getElementById('statusBadge').innerHTML = '🔴 خطا در اتصال';
            }
        }
        
        // رندر نوتیفیکیشن‌ها
        function renderNotifications(notifications) {
            const container = document.getElementById('notificationsContainer');
            
            if (!notifications || notifications.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">📭</div>
                        <h3>هنوز پیامی ارسال نشده</h3>
                        <p>مدیر می‌تواند از طریق ربات تلگرام پیام ارسال کند</p>
                        <p style="margin-top: 10px; font-size: 0.9em; color: #a0aec0;">
                            برای شروع، یک پیام به ربات بفرستید
                        </p>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = notifications.map(notif => {
                const isNew = notif.id > lastId;
                return `
                    <div class="notification ${isNew ? 'new' : ''}" id="notif-${notif.id}">
                        <div class="sender">
                            👤 ${notif.sender || 'مدیر'}
                            <span class="badge">${notif.chat_id ? '📱' : '💻'}</span>
                            <span class="time">${formatTime(notif.created_at)}</span>
                        </div>
                        <div class="message">
                            <span class="label">📝 پیام:</span>
                            ${notif.message}
                        </div>
                        <div style="color: #a0aec0; font-size: 0.85em; text-align: left;">
                            🕐 ${new Date(notif.created_at).toLocaleString('fa-IR')}
                        </div>
                    </div>
                `;
            }).join('');
            
            // بروزرسانی lastId
            if (notifications.length > 0) {
                lastId = notifications[0].id;
            }
        }
        
        // فرمت زمان
        function formatTime(timestamp) {
            const date = new Date(timestamp);
            const now = new Date();
            const diff = Math.floor((now - date) / 1000);
            
            if (diff < 60) return 'لحظاتی پیش';
            if (diff < 3600) return `${Math.floor(diff / 60)} دقیقه پیش`;
            if (diff < 86400) return `${Math.floor(diff / 3600)} ساعت پیش`;
            if (diff < 172800) return 'دیروز';
            return date.toLocaleDateString('fa-IR');
        }
        
        // اتصال به استریم برای دریافت نوتیفیکیشن جدید
        function connectStream() {
            let eventSource;
            
            try {
                eventSource = new EventSource('/stream');
                
                eventSource.onopen = function() {
                    console.log('✅ Stream connected');
                    document.getElementById('statusBadge').innerHTML = 
                        '🟢 متصل <span class="count" id="notifCount">' + 
                        (document.getElementById('notifCount')?.textContent || '0') + '</span>';
                };
                
                eventSource.onmessage = function(event) {
                    try {
                        const notif = JSON.parse(event.data);
                        
                        // افزودن نوتیفیکیشن جدید
                        const container = document.getElementById('notificationsContainer');
                        
                        // حذف حالت خالی
                        if (container.querySelector('.empty-state')) {
                            container.innerHTML = '';
                        }
                        
                        const notifHtml = `
                            <div class="notification new" id="notif-${notif.id}">
                                <div class="sender">
                                    👤 ${notif.sender || 'مدیر'}
                                    <span class="badge">📱</span>
                                    <span class="time">لحظاتی پیش</span>
                                </div>
                                <div class="message">
                                    <span class="label">📝 پیام:</span>
                                    ${notif.message}
                                </div>
                                <div style="color: #a0aec0; font-size: 0.85em; text-align: left;">
                                    🕐 ${new Date(notif.created_at).toLocaleString('fa-IR')}
                                </div>
                            </div>
                        `;
                        
                        // افزودن به بالای لیست
                        container.insertAdjacentHTML('afterbegin', notifHtml);
                        
                        // بروزرسانی تعداد
                        const countEl = document.getElementById('notifCount');
                        if (countEl) {
                            countEl.textContent = parseInt(countEl.textContent || '0') + 1;
                        }
                        
                        // بروزرسانی lastId
                        if (notif.id > lastId) {
                            lastId = notif.id;
                        }
                        
                        // نمایش توست
                        showToast('🔔 پیام جدید از ' + (notif.sender || 'مدیر'));
                        
                        // پخش صدا
                        try {
                            const audio = new Audio('data:audio/wav;base64,UklGRnoAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoAAACBhYqFhYaFhYaFhYaFhYaFhYaFhYaFhYaFhYaFhYaFhYaFhYaFhYaFhYaFhYaFhYaFhYaFhYaFhYaFhYaFhYaFhYaFhYaFhYaFhYaFhYaFhYaFhYaFhYaFhYaFhYWFhYaFhYaFhYaFhYaFhYaFhYaFhYaFhYaFhYaFhYaFhYaFhYaFhYaFhYaFhYaFhYaFhYaFhYaFhYWFhYaFhYaFhYaFhYaFhYaFhYaFhYaFhYWFhYaFhYaFhYaFhYaFhYWFhYW');
                            audio.play().catch(e => console.log('Audio play failed'));
                        } catch(e) {}
                        
                    } catch (error) {
                        console.error('Error processing stream message:', error);
                    }
                };
                
                eventSource.onerror = function(event) {
                    console.log('Stream error, reconnecting...');
                    if (eventSource) {
                        eventSource.close();
                    }
                    document.getElementById('statusBadge').innerHTML = '🟡 در حال اتصال مجدد...';
                    setTimeout(connectStream, 3000);
                };
                
            } catch (error) {
                console.error('Stream connection error:', error);
                setTimeout(connectStream, 5000);
            }
        }
        
        // نمایش توست
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.style.display = 'block';
            
            // پخش صدای نوتیفیکیشن
            try {
                const audio = new Audio('data:audio/wav;base64,UklGRnoAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoAAACBhYqFhYaFhYaFhYaFhYaFhYaFhYaFhYaFhYaFhYaFhYaFhYaFhYaFhYaFhYaFhYaFhYaFhYaFhYaFhYaFhYaFhYaFhYaFhYaFhYaFhYaFhYaFhYaFhYaFhYaFhYWFhYaFhYaFhYaFhYaFhYaFhYaFhYaFhYaFhYaFhYaFhYaFhYaFhYaFhYaFhYaFhYaFhYaFhYaFhYWFhYaFhYaFhYaFhYaFhYaFhYaFhYaFhYWFhYaFhYaFhYaFhYaFhYWFhYW');
                audio.play().catch(() => {});
            } catch(e) {}
            
            clearTimeout(window.toastTimeout);
            window.toastTimeout = setTimeout(() => {
                toast.style.display = 'none';
            }, 4000);
        }
        
        // بارگذاری اولیه
        document.addEventListener('DOMContentLoaded', () => {
            loadNotifications();
            
            // اتصال به استریم بعد از ۲ ثانیه
            setTimeout(connectStream, 2000);
            
            // آپدیت هر ۳۰ ثانیه (پشتیبان)
            setInterval(() => {
                loadNotifications();
            }, 30000);
        });
        
        // بازیابی اتصال در صورت بازگشت تب
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) {
                loadNotifications();
            }
        });
    </script>
</body>
</html>
